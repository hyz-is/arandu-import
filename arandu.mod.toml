# What this package declares about itself.
#
# The declaration is capability, not intent, and `aru doctor` compares it with
# what the code imports and calls. A package that says it makes no outbound
# calls and then holds an HTTP client is rejected, which is what makes the
# four lines below worth reading before installing anything.

name = "hyz-is/import"
framework = ">= 0.67"
profiles = ["conventional", "performance"]

[permissions]
# It answers requests, reads its own rows and runs two jobs on the queue the
# application passes in. Nothing leaves the process.
network = false
# It opens no file of its own. The uploads, the reports and the exports go to the
# Disk the application passes in Config.Files, in production a private bucket,
# under keys the server generates.
filesystem = false
# It runs no other program.
exec = false
# migrations.go owns the import_runs table, so whoever installs this has to run
# `aru migrate`. Declaring it is how they find that out before deploying.
migrations = true
